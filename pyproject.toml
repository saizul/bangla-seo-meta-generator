[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bangla-seo-meta-generator"
version = "0.1.0"
description = "SEO metadata helpers for Bangla and English posts: grapheme-aware length checks, slug transliteration, JSON-LD and a checker."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saizul Amin" }]
keywords = ["seo", "bangla", "bengali", "json-ld", "slug", "transliteration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Bengali",
    "Environment :: Console",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://saizul.com"

[project.scripts]
bangla-seo = "bangla_seo_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
